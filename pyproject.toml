[project]
name = "command-line-python"
version = "0.1.0"
description = "Python versions of the command-line tools from Command-Line Rust"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.10.1",
    "csvchk>=0.3.2",
    "csvkit>=2.2.0",
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "new-py>=0.1.4",
    "pylint>=4.1.3",
    "pytest<9",
    "pytest-flake8>=1.3.0",
    "pytest-mypy>=1.1.0",
    "pytest-pylint>=0.21.0",
    "yapf>=0.43.0",
]

[tool.uv]
package = false
